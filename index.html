<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA -->
    <meta name="theme-color" content="#10b981" />
    <meta name="description" content="Sistem informasi akademik SMAI DUBA" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SIMAK SMAI" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>SIMAK SMAI DUBA</title>

    <!-- Anti-FOUC: Apply theme sebelum Vue load -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('simak_theme') || 'dark';
          document.documentElement.classList.add(t === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
